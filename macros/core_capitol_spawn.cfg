#textdomain wesnoth-Conquest

#define CAPITOL_NEUTRALS_ANNOUNCEMENT
	[if]
		{VARIABLE_CONDITIONAL CE_SYSTEM.spawns_theme numerical_not_equals 12}
		[then]
			[sound]
				name=dragonstick.ogg
			[/sound]
			[print]
				text=_"         Neutral units (White)
spawn on empty Cities at Turn 2.
         They can’t attack you."
				size=32
				duration=5000
				color=200,200,200
			[/print]
		[/then]
	[/if]
#enddef
