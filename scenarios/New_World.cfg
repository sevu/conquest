#textdomain wesnoth-Conquest

[multiplayer]
	id=Conquest_Archipelago
	name=_"Conquest Archipelago"
	description=_ "A naval map found in forums. Small isles are special.
Regions on the biggest island are random." + "

" + _"Check the »Custom Options« tab."
	map_file=~add-ons/Conquest_Asterisk/maps/the_new_world.map
	{OBJECTIVES_NOTE_MAP_BY _"Map from r.wesnoth.org/p468490"}
	{SCENARIO_MACROS}
	[options]
		{OPTIONS_FOR_ALL_MAPS THEME=8 MAX=7}
		{OPTIONS_FOR_AI INCOME=5}
		[choice]
			id=CE_SYSTEM.label_style
			name=_"Label Style"
			default=bonus
			description=_"Towns have no names yet. You can name them."
			[item]
				value=bonus
				name=_"Town (+Bonus)"
			[/item]
			[item]
				value=region
				name=_"Region +Bonus"
			[/item]
			[item]
				value=number
				name=_"Only Number"
			[/item]
		[/choice]
	[/options]
	[load_resource]
		id=Conquest_mechanism
	[/load_resource]

	{RECRUIT_UNIT_MENU (
		{HUMAN_RECRUITS    *^Vh,*^Vhc,*^Vht}
		{ELVES_RECRUITS    *^Ve*}
		{ORCS_RECRUITS     *^Vc}
		{DWARVES_RECRUITS  *^Vu,*^Vhh,*^Vud}
		{DRAKES_RECRUITS   *^Vd,*^Vka}
		{UNDEAD_RECRUITS   *^Vhs*}
		{MERFOLK_RECRUITS  *^Vm*}
		{DUNEFOLK_RECRUITS *^Vdt,*^Vct,*^Vda,*^Vl}
	)}

	[event]
		name=prestart

		[if]
			# Set a defaut if Wesnoth is started form terminal.
			{VARIABLE_CONDITIONAL CE_SYSTEM.label_style equals ""}
			[then]
				{VARIABLE CE_SYSTEM.label_style region}
			[/then]
		[/if]

		[if]
			# When displaying region names on map, show a region table.
			{VARIABLE_CONDITIONAL CE_SYSTEM.label_style equals region}
			{VARIABLE_CONDITIONAL CE_SYSTEM.show_village_labels_in_fog not_equals no}
			[then]
				{VARIABLE CE_SYSTEM.region_table 7,75}
				{VARIABLE CE_SYSTEM.rows 4}
			[/then]
		[/if]

		{~add-ons/Conquest_Asterisk/regions/archipel.rgs}

		# Start a new column for random regions.
		{VARIABLE_OP CE_SYSTEM.column add 4}
		{VARIABLE CE_SYSTEM.row 0}
		{VARIABLE CE_SYSTEM.rows 5}

		[lua]
			name="random_region.lua"
			code={~add-ons/Conquest_Asterisk/lua/random_region.lua}
		[/lua]

		{CLEAR_VARIABLE CE_SYSTEM.label_style,CE_SYSTEM.region_table,CE_SYSTEM.rows,CE_SYSTEM.row,CE_SYSTEM.column}
	[/event]

[/multiplayer]
