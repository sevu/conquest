#textdomain wesnoth-Conquest

[multiplayer]
	id=Conquest_Crusades
	name=_"Conquest Crusades"
	# po: 2 lines for text
	description=_ "A good map for many players. Everybody has water access.
Can be played with Realm mode." + "

" + _ "Check the »Custom Options« tab."
	map_file=~add-ons/Conquest_Asterisk/maps/crusades.map
	{OBJECTIVES_NOTE_MAP_BY _"Map by Mabuse – modified by enclave, ported by Shiki"}
	{SCENARIO_MACROS}
	{CONQUEST_SIDE _"Extra-Player" null lightblue}
	[options]
		# 12 is the distance between villages of the two islands.
		{OPTIONS_FOR_ALL_MAPS MIN=12 THEME=2}
		{OPTIONS_FOR_AI}
	[/options]
	[load_resource]
		id=Conquest_mechanism
	[/load_resource]

	{RECRUIT_UNIT_MENU {HUMAN_RECRUITS *^V*}}

	[event]
		name=prestart

		{VARIABLE castleavailable yes}
		{VARIABLE CE_SYSTEM.number_of_attempts 2}
		{VARIABLE CE_SYSTEM.region_table 4,46}
		{VARIABLE CE_SYSTEM.rows 3}

		{~add-ons/Conquest_Asterisk/regions/crusades.rgs}

		{CLEAR_VARIABLE CE_SYSTEM.region_table,CE_SYSTEM.rows,CE_SYSTEM.row,CE_SYSTEM.column}

		[lua]
			name="realm_max_7_sides"
			code=<<wml.variables.players = #wesnoth.sides.find{ wml.tag.has_unit { canrecruit = true } }
if wml.variables.players <= 7 then
	wml.variables.realmavailable = true
end
>>
		[/lua]
	[/event]

	[event]
		name=destroy

		# Removing the islands from the game in castle mode.
		[terrain]
			terrain=Exos
			x= 2, 9,22,26
			y=22,23,23,22
		[/terrain]
		[label]
			text=""
			x= 2, 9,22,26
			y=22,23,23,22
		[/label]
	[/event]

	[event]
		name=turn 1 refresh
		first_time_only=no
		[filter_side]
			side=1,2,3,4,5,6,8,9,10
		[/filter_side]
		[filter_condition]
			[variable]
				name=realm_mode
				boolean_equals=yes
			[/variable]
		[/filter_condition]

		#        REALM MODE       7p 6p 5p 4p 3p 2p
		# (North-West) Byzantine  *  *  *  *  *  *   6p: after Seljuks
		# (South-West) Cairo      *  *  *  *  *  *   6p: after Seljuks, Arabia, Byzantine
		# (West)       Abasid     *  *  *  *  *
		# (West)       Jerusalem  *  *  *  *         6p: after Seljuks, Abasid
		# (North)      Seljuks    *  *  *
		# (South-East) Arabia     *  *
		# (Center)     Isles      *

		# Each village and each additional region income gives 2 less staring gold.
		# Formula for starting gold: 48 - 2*(villages+region bonus)

		# For 6p:
		# Abasid  (West)
		# Seljuks (Noth)
		# Arabia  (South-East)
		# Byzantine (North-West, unlocked after choosing Seljuks)
		# Jerusalem (West, unlocked after choosing Seljuks and Abasid)
		# Cairo     (South-West, unlocked after Arabia and Byzantine (and Seljuks))

		#textdomain wesnoth-Conquest_Vilas
		[message]
			{REALM_MESSAGE}

			[option]
				[show_if]
					{VARIABLE_CONDITIONAL took_region.byzantine boolean_equals no}
					[and]
						[variable]
							name="took_region.seljuks"
							boolean_equals=yes
						[/variable]
						[or]
							{VARIABLE_CONDITIONAL players less_than 6}
						[/or]
					[/and]
				[/show_if]
				# po: realm region
				{REALM_REGION _"BYZANTINE EMPIRE" 7 9 16}
				[command]
					[set_variable]
						name="took_region.byzantine"
						value=yes
					[/set_variable]
					[scroll_to]
						x,y=8,6
						side=$side_number
					[/scroll_to]
					{UNITPLACE 7 1}
					{UNITPLACE 3 3}
					{UNITPLACE 2 7}
					{UNITPLACE 5 6}
					{UNITPLACE 7 7}
					{UNITPLACE 10 8}
					{UNITPLACE 8 10}
					[gold]
						amount=16
						side=$side_number
					[/gold]
				[/command]
			[/option]

			[option]
				[show_if]
					{VARIABLE_CONDITIONAL took_region.jerusalem boolean_equals no}
					{VARIABLE_CONDITIONAL players greater_than_equal_to 4}
					[and]
						[variable]
							name="took_region.seljuks"
							boolean_equals=yes
						[/variable]
						[variable]
							name="took_region.abasid"
							boolean_equals=yes
						[/variable]
						[or]
							{VARIABLE_CONDITIONAL players less_than 6}
						[/or]
					[/and]
				[/show_if]
				# po: realm region
				{REALM_REGION _"JERUSALEM" 6 8 20}
				[command]
					[set_variable]
						name="took_region.jerusalem"
						value=yes
					[/set_variable]
					[scroll_to]
						x,y=34,23
						side=$side_number
					[/scroll_to]
					{UNITPLACE 34 18}
					{UNITPLACE 39 22}
					{UNITPLACE 34 22}
					{UNITPLACE 37 24}
					{UNITPLACE 31 27}
					{UNITPLACE 34 28}
					[gold]
						amount=20
						side=$side_number
					[/gold]
				[/command]
			[/option]

			[option]
				[show_if]
					{VARIABLE_CONDITIONAL took_region.abasid boolean_equals no}
					{VARIABLE_CONDITIONAL players greater_than_equal_to 3}
				[/show_if]
				# po: realm region
				{REALM_REGION _"ABASID" 5 7 24}
				[command]
					[set_variable]
						name="took_region.abasid"
						value=yes
					[/set_variable]
					[scroll_to]
						x,y=46,21
						side=$side_number
					[/scroll_to]
					{UNITPLACE 45 15}
					{UNITPLACE 44 19}
					{UNITPLACE 49 20}
					{UNITPLACE 47 23}
					{UNITPLACE 49 28}
					[gold]
						amount=24
						side=$side_number
					[/gold]
				[/command]
			[/option]

			[option]
				[show_if]
					{VARIABLE_CONDITIONAL took_region.seljuks boolean_equals no}
					{VARIABLE_CONDITIONAL players greater_than_equal_to 5}
				[/show_if]
				# po: realm region
				{REALM_REGION _"SELJUKS" 5 6 26}
				[command]
					[set_variable]
						name="took_region.seljuks"
						value=yes
					[/set_variable]
					[scroll_to]
						x,y=24,8
						side=$side_number
					[/scroll_to]
					{UNITPLACE 20 6}
					{UNITPLACE 28 6}
					{UNITPLACE 24 8}
					{UNITPLACE 27 10}
					{UNITPLACE 20 11}
					[gold]
						amount=26
						side=$side_number
					[/gold]
				[/command]
			[/option]

			[option]
				[show_if]
					{VARIABLE_CONDITIONAL took_region.cairo boolean_equals no}
					[and]
						[variable]
							name="took_region.byzantine"
							boolean_equals=yes
						[/variable]
						[variable]
							name="took_region.arabia"
							boolean_equals=yes
						[/variable]
						[or]
							{VARIABLE_CONDITIONAL players less_than 6}
						[/or]
					[/and]
				[/show_if]
				# po: realm region
				{REALM_REGION _"CAIRO" 5 6 26}
				[command]
					[set_variable]
						name="took_region.cairo"
						value=yes
					[/set_variable]
					[scroll_to]
						x,y=6,33
						side=$side_number
					[/scroll_to]
					{UNITPLACE 1 34}
					{UNITPLACE 4 31}
					{UNITPLACE 9 30}
					{UNITPLACE 3 36}
					{UNITPLACE 8 34}
					[gold]
						amount=26
						side=$side_number
					[/gold]
				[/command]
			[/option]

			[option]
				[show_if]
					{VARIABLE_CONDITIONAL took_region.arabia boolean_equals no}
					{VARIABLE_CONDITIONAL players greater_than_equal_to 6}
				[/show_if]
				# po: realm region
				{REALM_REGION _"ARABIA" 4 6 28}
				[command]
					[set_variable]
						name="took_region.arabia"
						value=yes
					[/set_variable]
					[scroll_to]
						x,y=33,40
						side=$side_number
					[/scroll_to]
					{UNITPLACE 35 37}
					{UNITPLACE 29 40}
					{UNITPLACE 31 43}
					{UNITPLACE 38 41}
					[gold]
						amount=28
						side=$side_number
					[/gold]
				[/command]
			[/option]

			# 7th region as fallback option.
			#textdomain wesnoth-Conquest
			[option]
				[show_if]
					{VARIABLE_CONDITIONAL took_region.isles boolean_equals no}
					{VARIABLE_CONDITIONAL players greater_than_equal_to 7}
				[/show_if]
				# po: realm region
				{REALM_REGION _"ISLANDS" 4 4 35}
				[command]
					[set_variable]
						name="took_region.isles"
						value=yes
					[/set_variable]
					[scroll_to]
						x,y=13,23
						side=$side_number
					[/scroll_to]
					{UNITPLACE 2 22}
					{UNITPLACE 9 23}
					{UNITPLACE 22 23}
					{UNITPLACE 26 22}
					[gold]
						amount=35
						side=$side_number
					[/gold]
				[/command]
			[/option]
		[/message]
	[/event]
[/multiplayer]
